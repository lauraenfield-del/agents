name: Feature request
description: Propose an improvement with enough context for evaluation.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem and the outcome you want, not just the implementation idea.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What limitation, friction, or gap are you trying to address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What outcome or behavior would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: additional
    attributes:
      label: Additional context
